t-anchor="middle">Hair Wash</text></g><g class="fp-zone" data-zone="junior-styling" data-tone="butter" tabindex="0" role="button" aria-label="Junior Styling: show details"><path class="fp-area" d="M450 602 562 602 569 820 450 820Z"/><circle class="fp-furn fp-furn--blue" cx="530" cy="645" r="14"/><rect class="fp-furn" x="553" y="633" width="8" height="24" rx="3"/><circle class="fp-furn fp-furn--blue" cx="530" cy="707" r="14"/><rect class="fp-furn" x="553" y="695" width="8" height="24" rx="3"/><circle class="fp-furn fp-furn--blue" cx="530" cy="769" r="14"/><rect class="fp-furn" x="553" y="757" width="8" height="24" rx="3"/><text x="505" y="806" text-anchor="middle">Junior Styling</text></g><g class="fp-zone" data-zone="little-nails" data-tone="blue" tabindex="0" role="button" aria-label="Little Nails: show details"><path class="fp-area" d="M275 478C330 478 395 560 390 640 385 760 300 860 290 985H48L276 478Z"/><circle class="fp-furn" cx="296" cy="545" r="16"/><rect class="fp-furn" x="250" y="620" width="92" height="30" rx="15" transform="rotate(18 296 635)"/><rect class="fp-furn" x="206" y="710" width="92" height="30" rx="15" transform="rotate(18 252 725)"/><rect class="fp-furn" x="162" y="800" width="92" height="30" rx="15" transform="rotate(18 208 815)"/><rect class="fp-furn" x="118" y="890" width="92" height="30" rx="15" transform="rotate(18 164 905)"/><text x="318" y="612" text-anchor="middle">Little Nails</text></g><g class="fp-zone" data-zone="retail" data-tone="oak" tabindex="0" role="button" aria-label="Retail: show details"><path class="fp-area" d="M260 520 274 520 110 900 94 892ZM432 850H560V872H432Z"/><text x="496" y="866" text-anchor="middle">Retail</text></g><g class="fp-zone" data-zone="entry-billing" data-tone="oak" tabindex="0" role="button" aria-label="Entry &amp; Billing: show details"><path class="fp-area" d="M44 960H582L585 995H40ZM440 882H540V940H440Z"/><rect class="fp-furn fp-furn--butter" x="452" y="896" width="76" height="30" rx="15"/><text x="240" y="984" text-anchor="middle">Entry &amp; Billing</text></g>
<text class="fp-label" x="312" y="1030" text-anchor="middle">ENTRY</text>
</svg>
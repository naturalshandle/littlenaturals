<g class="dash" mask="url(#heli-mask)"><path d="M110 120C110 88 138 72 176 72H232C268 72 290 96 290 120S268 160 232 160H150C126 160 110 146 110 120Z"/><path d="M176 84H228C248 84 262 98 264 116H176Z"/><path d="M140 116H160"/><path d="M288 110L356 102V118L288 132"/><path d="M350 102L364 74H376L372 104"/><path d="M200 72V54"/><path d="M142 160L136 184M252 160L258 184M108 184H288"/><path d="M22 70a12.6 12.6 0 0 1 21.0-10.5a17.9 17.9 0 0 1 33.6 3.2a12.6 12.6 0 0 1 6.3 24.2h-58.8a9.5 9.5 0 0 1 -2.1-16.8z"/><path d="M300 36a9.6 9.6 0 0 1 16.0-8.0a13.6 13.6 0 0 1 25.6 2.4a9.6 9.6 0 0 1 4.8 18.4h-44.8a7.2 7.2 0 0 1 -1.6-12.8z"/><path d="M40 190a10.8 10.8 0 0 1 18.0-9.0a15.3 15.3 0 0 1 28.8 2.7a10.8 10.8 0 0 1 5.4 20.7h-50.4a8.1 8.1 0 0 1 -1.8-14.4z"/><path d="M312 200a13.2 13.2 0 0 1 22.0-11.0a18.7 18.7 0 0 1 35.2 3.3a13.2 13.2 0 0 1 6.6 25.3h-61.6a9.9 9.9 0 0 1 -2.2-17.6z"/></g>
<g class="dash rotor"><g class="main-rotor"><path d="M110 52H290"/></g><g class="tail-rotor"><circle cx="368" cy="112" r="13"/><path d="M368 99V125M355 112H381"/></g></g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" class="strands" viewBox="0 0 300 340" aria-hidden="true" focusable="false"><style>

:root {
  
  --cream:     #F7F0E4;  
  --sand:      #EBDDC4;  
  --baby-blue: #B7CFDA;  
  --blue-deep: #8AAAC2;  
  --butter:    #F2D680;  
  --glow:      #FFEAB0;  
  --oak:       #D6B88F;  
  --brass:     #C9A45F;  
  --ink:       #1E2F3D;  
  --white:     #FFFFFF;  

  
  --ink-soft:   color-mix(in srgb, var(--ink) 78%, var(--cream));   
  --ink-night:  color-mix(in srgb, var(--ink) 88%, var(--baby-blue)); 
  --line:       color-mix(in srgb, var(--ink) 14%, transparent);
  --blue-wash:  color-mix(in srgb, var(--baby-blue) 50%, var(--white));
  --butter-wash: color-mix(in srgb, var(--butter) 40%, var(--cream));

  
  --font-display: "Quicksand", "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --font-body:    "Nunito", ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-script:  "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --font-label:   "Cinzel", "Trajan Pro", Georgia, "Times New Roman", serif;

  
  --step--1: clamp(0.83rem, 0.80rem + 0.13vw, 0.92rem);
  --step-0:  clamp(1.00rem, 0.96rem + 0.19vw, 1.13rem);
  --step-1:  clamp(1.20rem, 1.13rem + 0.31vw, 1.41rem);
  --step-2:  clamp(1.44rem, 1.32rem + 0.51vw, 1.77rem);
  --step-3:  clamp(1.73rem, 1.54rem + 0.81vw, 2.25rem);
  --step-4:  clamp(2.07rem, 1.78rem + 1.24vw, 2.90rem);
  --step-5:  clamp(2.49rem, 2.04rem + 1.90vw, 3.75rem);
  --step-6:  clamp(2.99rem, 2.32rem + 2.84vw, 4.85rem);

  --leading-tight: 1.12;
  --leading: 1.65;
  --tracking-label: 0.3em;

  
  --space-3xs: 0.25rem;
  --space-2xs: 0.5rem;
  --space-xs:  0.75rem;
  --space-s:   1rem;
  --space-m:   1.5rem;
  --space-l:   2rem;
  --space-xl:  3rem;
  --space-2xl: clamp(3.5rem, 2.8rem + 3vw, 5.5rem);
  --space-3xl: clamp(5rem, 3.8rem + 5vw, 8.5rem);
  --gutter:    clamp(1rem, 0.6rem + 2vw, 2.5rem);
  --container: 76rem;
  --container-narrow: 46rem;

  
  --radius-s: 0.5rem;
  --radius-m: 1rem;
  --radius-l: 1.75rem;
  --radius-pill: 999px;
  --radius-arch: 999px 999px var(--radius-l) var(--radius-l);

  
  --shadow-s: 0 1px 2px color-mix(in srgb, var(--ink) 8%, transparent),
              0 4px 12px color-mix(in srgb, var(--ink) 6%, transparent);
  --shadow-m: 0 2px 6px color-mix(in srgb, var(--ink) 7%, transparent),
              0 18px 40px -12px color-mix(in srgb, var(--ink) 18%, transparent);
  --shadow-glow: 0 0 0 1px color-mix(in srgb, var(--butter) 60%, transparent),
                 0 10px 30px -6px color-mix(in srgb, var(--butter) 90%, transparent);

  
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-soft: cubic-bezier(0.45, 0, 0.2, 1);
  --dur-fast: 180ms;
  --dur: 420ms;
  --dur-slow: 900ms;

  --header-h: 5rem;
}

.strands { width: 100%; height: auto; overflow: visible; }
.strands .strand { transform-box: view-box; transform-origin: var(--ox) 0; transform: rotate(calc(var(--sway, 0) * var(--k, 1) * 1deg)); transition: transform 1.4s var(--ease-out); }
.strands line, .strands .rod { stroke: var(--blue-deep); stroke-width: 1.5; }
.strands .bead { fill: var(--glow); stroke: var(--oak); stroke-width: 1; }
.strands .disc { fill: color-mix(in srgb, var(--white) 70%, var(--baby-blue)); stroke: var(--blue-deep); stroke-width: 1; }
.strands .bottle { fill: var(--ink); }
.strands .cube { fill: var(--baby-blue); stroke: var(--blue-deep); stroke-width: 1; }
.strands .cube-icon { fill: none; stroke: var(--brass); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
@keyframes ribbon-drift { to { transform: translateX(-1200px); } }
@keyframes sign-warm {
  0%   { color: var(--brass); text-shadow: none; }
  30%  { color: var(--ink); text-shadow: 0 0 12px var(--glow); }
  38%  { text-shadow: none; }
  100% { color: var(--ink); text-shadow: 0 0 10px var(--glow), 0 0 28px var(--glow), 0 0 60px color-mix(in srgb, var(--butter) 70%, transparent); }
}
@keyframes twinkle { 50% { opacity: 0.25; transform: scale(0.7) rotate(20deg); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rotor { from { transform: scaleX(1); } to { transform: scaleX(0.35); } }
@keyframes swing { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
.i-line{fill:none;stroke:var(--ink);stroke-width:2} [data-neon]{opacity:1!important;animation:none!important}</style><g class="strand" style="--ox:30px;--k:0.80"><line x1="30" y1="0" x2="30" y2="300"/><circle class="bead" cx="30" cy="40" r="7"/><rect class="bottle" x="19" y="58" width="7" height="14" rx="2"/><rect class="bottle" x="33" y="61" width="6" height="11" rx="2"/><ellipse class="disc" cx="30" cy="74" rx="22" ry="4"/><circle class="bead" cx="30" cy="118" r="7"/><rect class="bottle" x="19" y="136" width="7" height="14" rx="2"/><rect class="bottle" x="33" y="139" width="6" height="11" rx="2"/><ellipse class="disc" cx="30" cy="152" rx="22" ry="4"/><circle class="bead" cx="30" cy="196" r="7"/><rect class="bottle" x="19" y="214" width="7" height="14" rx="2"/><rect class="bottle" x="33" y="217" width="6" height="11" rx="2"/><ellipse class="disc" cx="30" cy="230" rx="22" ry="4"/><circle class="bead" cx="30" cy="274" r="7"/></g><g class="strand" style="--ox:78px;--k:1.05"><line x1="78" y1="0" x2="78" y2="270"/><circle class="bead" cx="78" cy="62" r="7"/><rect class="bottle" x="67" y="80" width="7" height="14" rx="2"/><rect class="bottle" x="81" y="83" width="6" height="11" rx="2"/><ellipse class="disc" cx="78" cy="96" rx="22" ry="4"/><circle class="bead" cx="78" cy="140" r="7"/><rect class="bottle" x="67" y="158" width="7" height="14" rx="2"/><rect class="bottle" x="81" y="161" width="6" height="11" rx="2"/><ellipse class="disc" cx="78" cy="174" rx="22" ry="4"/><circle class="bead" cx="78" cy="218" r="7"/><rect class="bottle" x="67" y="236" width="7" height="14" rx="2"/><rect class="bottle" x="81" y="239" width="6" height="11" rx="2"/><ellipse class="disc" cx="78" cy="252" rx="22" ry="4"/></g><g class="strand" style="--ox:126px;--k:1.30"><line x1="126" y1="0" x2="126" y2="240"/><circle class="bead" cx="126" cy="40" r="7"/><rect class="bottle" x="115" y="58" width="7" height="14" rx="2"/><rect class="bottle" x="129" y="61" width="6" height="11" rx="2"/><ellipse class="disc" cx="126" cy="74" rx="22" ry="4"/><circle class="bead" cx="126" cy="118" r="7"/><rect class="bottle" x="115" y="136" width="7" height="14" rx="2"/><rect class="bottle" x="129" y="139" width="6" height="11" rx="2"/><ellipse class="disc" cx="126" cy="152" rx="22" ry="4"/><circle class="bead" cx="126" cy="196" r="7"/></g><g class="strand" style="--ox:174px;--k:0.80"><line x1="174" y1="0" x2="174" y2="300"/><circle class="bead" cx="174" cy="62" r="7"/><rect class="bottle" x="163" y="80" width="7" height="14" rx="2"/><rect class="bottle" x="177" y="83" width="6" height="11" rx="2"/><ellipse class="disc" cx="174" cy="96" rx="22" ry="4"/><circle class="bead" cx="174" cy="140" r="7"/><rect class="bottle" x="163" y="158" width="7" height="14" rx="2"/><rect class="bottle" x="177" y="161" width="6" height="11" rx="2"/><ellipse class="disc" cx="174" cy="174" rx="22" ry="4"/><circle class="bead" cx="174" cy="218" r="7"/><rect class="bottle" x="163" y="236" width="7" height="14" rx="2"/><rect class="bottle" x="177" y="239" width="6" height="11" rx="2"/><ellipse class="disc" cx="174" cy="252" rx="22" ry="4"/></g><g class="strand" style="--ox:222px;--k:1.05"><line x1="222" y1="0" x2="222" y2="270"/><circle class="bead" cx="222" cy="40" r="7"/><rect class="bottle" x="211" y="58" width="7" height="14" rx="2"/><rect class="bottle" x="225" y="61" width="6" height="11" rx="2"/><ellipse class="disc" cx="222" cy="74" rx="22" ry="4"/><circle class="bead" cx="222" cy="118" r="7"/><rect class="bottle" x="211" y="136" width="7" height="14" rx="2"/><rect class="bottle" x="225" y="139" width="6" height="11" rx="2"/><ellipse class="disc" cx="222" cy="152" rx="22" ry="4"/><circle class="bead" cx="222" cy="196" r="7"/><rect class="bottle" x="211" y="214" width="7" height="14" rx="2"/><rect class="bottle" x="225" y="217" width="6" height="11" rx="2"/><ellipse class="disc" cx="222" cy="230" rx="22" ry="4"/></g><g class="strand" style="--ox:270px;--k:1.30"><line x1="270" y1="0" x2="270" y2="240"/><circle class="bead" cx="270" cy="62" r="7"/><rect class="bottle" x="259" y="80" width="7" height="14" rx="2"/><rect class="bottle" x="273" y="83" width="6" height="11" rx="2"/><ellipse class="disc" cx="270" cy="96" rx="22" ry="4"/><circle class="bead" cx="270" cy="140" r="7"/><rect class="bottle" x="259" y="158" width="7" height="14" rx="2"/><rect class="bottle" x="273" y="161" width="6" height="11" rx="2"/><ellipse class="disc" cx="270" cy="174" rx="22" ry="4"/><circle class="bead" cx="270" cy="218" r="7"/></g></svg>